version: '3.8'

services:
  # --- Приложение ---
  app:
    image: detfiniktn/java-pks:latest
    container_name: pks-java-app
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./.env:/workspace/.env:ro
    environment:
      # Эти переменные должны совпадать с теми, что ожидает Spring Boot приложение
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - pks-network
    restart: unless-stopped

  # --- Инфраструктура ---
  postgres:
    image: postgres:16-alpine
    container_name: pks-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pks-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pks-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pks-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: pks-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - pks-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  pks-network:
    driver: bridge