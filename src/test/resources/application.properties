# Test-only configuration: fully isolated, no external infra required.
# This file takes precedence over src/main/resources/application.properties
# during tests, so `mvn test` never touches the dev Postgres/Redis/Minio
# and never evaluates the ${...} placeholders from the main file.

# Do NOT import the dev .env file during tests (it may not exist in CI,
# and spring.config.import entries are mandatory unless prefixed optional:).
spring.config.import=

server.port=0

app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0cy0zMmJ5dGVzISE=
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=86400000

# H2 in-memory instead of dev Postgres. Overrides the
# spring.datasource.url/username/password keys from the main file so their
# ${POSTGRES_*} placeholders are never evaluated.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_schema=

# Dev Flyway migration V1__ targets Postgres and the dev DB history has
# diverged (checksum mismatch); schema is created by Hibernate in tests.
spring.flyway.enabled=false

# Dummy values so the ${REDIS_*}/${MINIO_*} placeholders in the main file
# are never evaluated. Lettuce/Minio clients are lazy and never connect
# during contextLoads.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=test
spring.data.redis.timeout=2000ms
spring.data.redis.ssl.enabled=false

minio.endpoint=http://127.0.0.1:9000
minio.access-key=test-access-key
minio.secret-key=test-secret-key
minio.bucket-name=test-bucket
