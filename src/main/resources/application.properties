spring.application.name=java-pks
spring.config.import=file:.env[.properties]
server.port=${APP_PORT}

# Infra lifecycle is owned by compose.yaml run manually (README: start compose first).
# Spring's compose integration otherwise overrides spring.data.redis.* with
# ConnectionDetails that lack the redis password -> NOAUTH on every redis call.
spring.docker.compose.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_IN_MS}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_IN_MS}

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true


spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2000ms
spring.data.redis.ssl.enabled=false


minio.endpoint=http://127.0.0.1:${MINIO_PORT}
minio.access-key=${MINIO_ACCESS_TOKEN}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET_NAME}